services:
  webshare.service:
    class: Drupal\webshare\WebshareService
    factory: ['Drupal\webshare\WebshareService', 'create']
    arguments: ['@service_container']
  webshare.twig_extension:
    class: Drupal\webshare\TwigExtension\WebshareTwigExtension
    arguments: ['@webshare.service']
    tags:
      - { name: twig.extension }
