################################################################################
# GitLab CI for the Webshare module.
#
# Validation jobs (cspell / eslint / stylelint) plus three webship-js BDD
# browser-test jobs:
#   - webship-js-test                → Drupal Standard profile
#   - webship-js-test-drupal-cms     → Drupal CMS distribution
#   - webship-js-test-canvas         → Drupal Standard + Drupal Canvas
#
# The webship-js suite drives the site entirely through the browser. The
# first feature (01-01-01-users-login) logs in as the Webmaster, places the
# Share block on the front page and provisions the per-role testing users -
# so the before_script only has to build the site, enable the module(s) and
# install Node + Playwright.
################################################################################

include:
  - project: $_GITLAB_TEMPLATES_REPO
    ref: $_GITLAB_TEMPLATES_REF
    file:
      - "/includes/include.drupalci.main.yml"
      - "/includes/include.drupalci.variables.yml"
      - "/includes/include.drupalci.workflows.yml"

variables:
  COMPOSER_FLAGS: "--no-strict-lock"
  COMPOSER_MEMORY_LIMIT: "-1"
  # No yarn.lock is committed; Yarn 4 defaults to immutable installs and would
  # refuse to create one. Allow lockfile creation in CI for every job.
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

# Override the default composer job to use development versions.
composer:
  variables:
    DRUPAL_CORE: $CORE_SUPPORTED
    IGNORE_PROJECT_DRUPAL_CORE_VERSION: 0

# = Validate stage =
cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

# Node 20+ required: webship-js >=2.0 declares engines.node ">=20".
eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:js || true
    - yarn lint:yaml || true
  after_script:
    - touch junit.xml _eslint.patch
  allow_failure: true

stylelint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:css || true
  after_script:
    - echo '[]' > gl-codequality.json
  allow_failure: true

# = Reusable before_script fragments (via !reference) =
.fragments:
  web_db: &web_db
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - mkdir -pv $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/default/files
    - chmod -R 777 $CI_PROJECT_DIR/$_WEB_ROOT/sites/simpletest
    - rm -rf /var/www/html && ln -s $CI_PROJECT_DIR/$_WEB_ROOT /var/www/html
    - chown -R www-data:www-data $CI_PROJECT_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
  node_playwright: &node_playwright
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version && npm --version
    - 'test -f .yarnrc.yml || echo "nodeLinker: node-modules" > .yarnrc.yml'
    # Back up cucumber.js - webship-js's postinstall can clobber it under yarn 4.
    - cp cucumber.js .cucumber.js.bak
    - corepack enable
    - yarn install
    - cp .cucumber.js.bak cucumber.js && rm .cucumber.js.bak
    - ./node_modules/.bin/playwright install --with-deps chromium

# = Shared base for browser-test jobs =
.drupal-node-base:
  extends: .testing-job-base
  needs: [composer]
  # Override the parent's services - we only need the database. Playwright
  # bundles its own Chromium, so Selenium and chromedriver are not needed.
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml

# = webship-js BDD - Drupal Standard profile =
#
# Runs the `tests/features/drupal/` suite on the Drupal Standard profile
# with Drupal Canvas enabled (Canvas ships in the module's require-dev so
# every job in this pipeline has it available). Includes the Canvas page +
# content_template + blog node seeding for the @canvas scenarios.
webship-js-test:
  extends: .drupal-node-base
  before_script:
    - !reference [.fragments, web_db]
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT site:install standard
        --db-url=$SIMPLETEST_DB --account-name=webmaster --account-pass=dD.123123ddd
        --site-name="Webshare Test" -y
    # Core's Standard profile no longer ships the Article content type (it moved
    # to the optional `article_content_type` recipe) - apply it so the
    # "node.article.full" content template below has a real bundle to attach
    # to. Without this, Canvas\Entity\ContentTemplate::label() throws
    # "The 'article' bundle of the node entity type has no label." while
    # rendering the seeded blog node, which is a 500, not a webshare bug.
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT recipe $CI_PROJECT_DIR/$_WEB_ROOT/core/recipes/article_content_type
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT en webshare canvas -y
    # Seed Canvas content entities for the @canvas scenarios:
    #  - a Canvas page placing the webshare:share component,
    #  - a node.article.full content template that renders the share rail,
    #  - a sample blog-post article node.
    # The SDC component_version is resolved at runtime so the seed survives
    # Canvas schema bumps.
    - |
      $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT php:eval '
        $component = \Drupal::entityTypeManager()->getStorage("component")->load("sdc.webshare.share");
        if (!$component) { return; }
        $version = $component->getActiveVersion();
        $pages = \Drupal::entityTypeManager()->getStorage("canvas_page");
        foreach ($pages->loadByProperties(["title" => "Webshare Canvas Test"]) as $entity) { $entity->delete(); }
        \Drupal\canvas\Entity\Page::create([
          "title" => "Webshare Canvas Test",
          "status" => 1,
          "path" => ["alias" => "/webshare-canvas-test"],
          "components" => [
            "uuid" => "11111111-1111-4111-8111-111111111111",
            "component_id" => "sdc.webshare.share",
            "component_version" => $version,
            "inputs" => [
              "heading" => "Share this page",
              "display_title" => TRUE,
              "alignment" => "start",
              "orientation" => "horizontal",
              "mobile_visibility" => "all",
              "native_share" => TRUE,
              "placement" => "inline",
            ],
          ],
        ])->save();
        $templates = \Drupal::entityTypeManager()->getStorage("content_template");
        if ($existing = $templates->load("node.article.full")) { $existing->delete(); }
        \Drupal\canvas\Entity\ContentTemplate::create([
          "status" => TRUE,
          "content_entity_type_id" => "node",
          "content_entity_type_bundle" => "article",
          "content_entity_type_view_mode" => "full",
          "component_tree" => [[
            "uuid" => "22222222-2222-4222-8222-222222222222",
            "component_id" => "sdc.webshare.share",
            "component_version" => $version,
            "inputs" => [
              "heading" => "Share this article",
              "display_title" => TRUE,
              "alignment" => "end",
              "orientation" => "vertical",
              "mobile_visibility" => "all",
              "native_share" => TRUE,
              "placement" => "rail-end",
            ],
          ]],
        ])->save();
        $nodes = \Drupal::entityTypeManager()->getStorage("node");
        foreach ($nodes->loadByProperties(["title" => "Community behind Webshare"]) as $entity) { $entity->delete(); }
        \Drupal\node\Entity\Node::create([
          "type" => "article",
          "title" => "Community behind Webshare",
          "status" => 1,
          "path" => ["alias" => "/blog/community-behind-webshare"],
          "body" => ["value" => "<p>Hello blog body.</p>", "format" => "basic_html"],
        ])->save();
      '
    - $CI_PROJECT_DIR/vendor/bin/drush --root=$CI_PROJECT_DIR/$_WEB_ROOT cache:rebuild
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.js loads only `tests/features/drupal/**`. Disable webship-js's
    # auto HTML hook (it cannot await PDF generation from `process.on('exit')`)
    # and run `generate-reports` explicitly after cucumber-js so both HTML and
    # PDF land next to the JSON in `tests/reports/drupal/`.
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.js --tags "not @wip"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/drupal/cucumber_report.json
        --out  tests/reports/drupal/cucumber_report.html
        --format all
        --pdf-out tests/reports/drupal/cucumber_report.pdf
  allow_failure: false

# = webship-js BDD - Drupal CMS distribution =
#
# Runs the `tests/features/drupalcms/` suite on a Drupal CMS distribution
# (drupal/cms) installed with the `drupal_cms_installer` profile, not the
# Standard profile.
#
# This job does NOT extend `.drupal-node-base` - drupalci's prebuilt
# `composer` artefact pins `cweagans/composer-patches` to ~1.0, which
# conflicts with drupal/cms ≥2.1 (requires ^2). Instead the job runs
# `composer create-project drupal/cms` from scratch into a sibling
# directory, then adds the local webshare module path.
#
# The Drupal CMS installer ignores `--account-name` / `--account-pass`,
# so uid 1 is renamed post-install to `webmaster` with the password the
# shared cucumber `users` registry expects.
webship-js-test-drupal-cms:
  extends: .testing-job-base
  needs: []
  services:
    - name: $_CONFIG_DOCKERHUB_ROOT/$_TARGET_DB_TYPE-$_TARGET_DB_VERSION:$_TARGET_DB_IMAGE_TAG
      alias: database
  variables:
    DRUPAL_ADMIN_USERNAME: "webmaster"
    DRUPAL_ADMIN_PASSWORD: "dD.123123ddd"
    DRUPAL_TEST_BASE_URL: "http://localhost"
    LAUNCH_URL: "http://localhost"
    FORCE_COLOR: "1"
    _CMS_BUILD_DIR: "/tmp/cms-build"
  artifacts:
    when: always
    paths:
      - tests/reports/
      - tests/screenshots/
      - tests/videos/
    expire_in: 7 days
    reports:
      junit: tests/reports/junit.xml
  before_script:
    # = Build a fresh Drupal CMS project (does not collide with drupalci) =
    - composer create-project drupal/cms $_CMS_BUILD_DIR --no-interaction --no-progress
    # = Add the local webshare module as a `path` repository + require it =
    # drupal/cms ships `minimum-stability: stable`; the local checkout is the
    # `2.0.x-dev` branch, so require it with explicit `@dev` stability and
    # relax the project's own minimum-stability so the path-repo dev version
    # is acceptable. `prefer-stable` stays true so only this one package
    # picks up the dev release.
    - cd $_CMS_BUILD_DIR
    - composer config minimum-stability dev
    - composer config prefer-stable true
    # `options.versions` pins the path package's resolved version explicitly.
    # Without it, Composer guesses the version from the git working copy's
    # branch name - but an MR pipeline checks out a detached merge commit, so
    # there is no branch name and Composer falls back to `dev-<sha>`. That
    # package name does not satisfy the `2.0.x-dev@dev` constraint below, and
    # because path repos are canonical, the composer repo's real `dev-2.0.x`
    # is discarded too - failing every MR pipeline regardless of the diff.
    # https://getcomposer.org/doc/05-repositories.md#path
    - composer config repositories.webshare-local '{"type":"path","url":"'"$CI_PROJECT_DIR"'","options":{"symlink":true,"versions":{"drupal/webshare":"2.0.x-dev"}}}'
    - composer require 'drupal/webshare:2.0.x-dev@dev' --no-interaction --no-progress
    # = Web server =
    - mkdir -pv $_CMS_BUILD_DIR/web/sites/default/files
    - mkdir -pv $_CMS_BUILD_DIR/web/sites/simpletest
    - chmod -R 777 $_CMS_BUILD_DIR/web/sites/default/files
    - chmod -R 777 $_CMS_BUILD_DIR/web/sites/simpletest
    - rm -rf /var/www/html && ln -s $_CMS_BUILD_DIR/web /var/www/html
    - chown -R www-data:www-data $_CMS_BUILD_DIR
    - service apache2 start
    - export SIMPLETEST_DB=mysql://$MYSQL_USER:$MYSQL_PASSWORD@database/$MYSQL_DATABASE
    # = Drupal CMS site install =
    - $_CMS_BUILD_DIR/vendor/bin/drush --root=$_CMS_BUILD_DIR/web site:install drupal_cms_installer
        --db-url=$SIMPLETEST_DB --site-name="Webshare Drupal CMS Test" -y
    # = Rename uid 1 to webmaster =
    - $_CMS_BUILD_DIR/vendor/bin/drush --root=$_CMS_BUILD_DIR/web php:eval '$u=\Drupal\user\Entity\User::load(1); $u->setUsername("webmaster"); $u->setEmail("webmaster@example.test"); $u->setPassword("dD.123123ddd"); $u->save();'
    - $_CMS_BUILD_DIR/vendor/bin/drush --root=$_CMS_BUILD_DIR/web en webshare -y
    # = Seed the Mercury header + footer Canvas page_region entities =
    - |
      $_CMS_BUILD_DIR/vendor/bin/drush --root=$_CMS_BUILD_DIR/web php:eval '
        $component = \Drupal::entityTypeManager()->getStorage("component")->load("sdc.webshare.share");
        if (!$component) { return; }
        $version = $component->getActiveVersion();
        $regions = [
          "header" => "aaaaaaaa-1111-4111-8111-aaaaaaaaaaaa",
          "footer" => "bbbbbbbb-2222-4222-8222-bbbbbbbbbbbb",
        ];
        foreach ($regions as $region => $uuid) {
          $page_region = \Drupal::entityTypeManager()->getStorage("page_region")->load("mercury.$region");
          if (!$page_region) { continue; }
          $tree = $page_region->get("component_tree");
          $tree[$uuid] = [
            "uuid" => $uuid,
            "component_id" => "sdc.webshare.share",
            "component_version" => $version,
            "inputs" => [
              "heading" => $region === "footer" ? "Share this page" : "Share",
              "display_title" => $region === "footer",
              "alignment" => $region === "footer" ? "start" : "end",
              "orientation" => "horizontal",
              "mobile_visibility" => "all",
              "native_share" => TRUE,
              "placement" => "inline",
              "share_title" => "",
              "share_text" => "",
            ],
          ];
          $page_region->set("component_tree", $tree)->save();
        }
      '
    - $_CMS_BUILD_DIR/vendor/bin/drush --root=$_CMS_BUILD_DIR/web cache:rebuild
    # = Node.js 20 + Playwright Chromium (from CI_PROJECT_DIR - features live there) =
    - cd $CI_PROJECT_DIR
    - !reference [.fragments, node_playwright]
  script:
    # cucumber.drupalcms.js loads only `tests/features/drupalcms/**`. Disable
    # the auto HTML hook and run `generate-reports` explicitly so HTML + PDF
    # both land next to the JSON in `tests/reports/drupalcms/`.
    - WEBSHIP_REPORT_DISABLE=1 ./node_modules/.bin/cucumber-js --config cucumber.drupalcms.js --tags "not @wip"
    - node ./node_modules/webship-js/bin/generate-reports.js
        --json tests/reports/drupalcms/cucumber_report.json
        --out  tests/reports/drupalcms/cucumber_report.html
        --format all
        --pdf-out tests/reports/drupalcms/cucumber_report.pdf
  allow_failure: false

# = GitLab Pages - MkDocs documentation site =
#
# Builds the Material-for-MkDocs site under `docs/` and publishes it to
# https://project.pages.drupalcode.org/webshare/. Only runs for the
# default branch so feature branches don't replace the live docs.
#
# drupalci's pipeline declares the stages
#   .pre, build, validate, test, .post
# only - there is no `deploy` stage - so `pages` runs in `.post` (after
# every other stage finishes).
pages:
  stage: .post
  image: python:3.12-slim
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  before_script:
    - pip install --quiet mkdocs-material pymdown-extensions
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
    expire_in: 30 days
