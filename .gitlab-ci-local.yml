# Slim pipeline for `gitlab-ci-local` (https://github.com/firecow/gitlab-ci-local).
#
# The real .gitlab-ci.yml `include:`s the drupalci templates and runs the
# webship-js browser jobs inside the drupalci PHP-Apache image with a MySQL
# service - none of which gitlab-ci-local can reproduce ($_GITLAB_TEMPLATES_REPO
# is not a public path, and the browser jobs need the composer-built site
# artifact). This file mirrors the jobs that ARE reproducible locally:
#   - validate-stage linters on Node 20 (webship-js >=2.0 declares engines.node ">=20")
#   - the GitLab Pages MkDocs build
#
# Usage:
#   npx gitlab-ci-local --file .gitlab-ci-local.yml            # all jobs
#   npx gitlab-ci-local --file .gitlab-ci-local.yml eslint     # one job
#   npx gitlab-ci-local --file .gitlab-ci-local.yml pages      # just the docs build

stages:
  - validate
  - pages

variables:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  allow_failure: true

stylelint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:css || true
  allow_failure: true

# Mirrors the real `pages` job in .gitlab-ci.yml so the MkDocs build can be
# verified locally before pushing. The drupalci pipeline schedules pages in
# the `.post` stage (it has no `deploy` stage); gitlab-ci-local does not
# expose `.post`, so we run it in our own `pages` stage instead.
pages:
  stage: pages
  image: python:3.12-slim
  before_script:
    - pip install --quiet mkdocs-material pymdown-extensions
  script:
    - mkdocs build --strict --site-dir public
  artifacts:
    paths:
      - public
