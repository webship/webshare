# Slim pipeline for `gitlab-ci-local` (https://github.com/firecow/gitlab-ci-local).
#
# The real .gitlab-ci.yml `include:`s the drupalci templates and runs the
# webship-js browser jobs inside the drupalci PHP-Apache image with a MySQL
# service - none of which gitlab-ci-local can reproduce ($_GITLAB_TEMPLATES_REPO
# is not a public path, and the browser jobs need the composer-built site
# artifact). This file therefore mirrors only the validate-stage jobs so the
# lint/spell tooling can be exercised locally on the Node 20 image that
# webship-js >=2.0 requires (engines.node ">=20").
#
# Usage:
#   npx gitlab-ci-local --file .gitlab-ci-local.yml            # all validate jobs
#   npx gitlab-ci-local --file .gitlab-ci-local.yml eslint     # one job

stages:
  - validate

variables:
  YARN_ENABLE_IMMUTABLE_INSTALLS: "false"

cspell:
  stage: validate
  image: node:20
  before_script:
    - npm install -g cspell
  script:
    - cspell "**/*.{php,module,inc,install,test,profile,theme,js,css,md,yml,txt}" --no-progress || true
  allow_failure: true

eslint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - node --version
    - yarn lint:js || true
    - yarn lint:yaml || true
  allow_failure: true

stylelint:
  stage: validate
  image: node:20
  before_script:
    - corepack enable
    - yarn install
  script:
    - yarn lint:css || true
  allow_failure: true
