webshare.settings:
  type: config_object
  label: 'Webshare settings'
  mapping:
    buttons:
      type: sequence
      label: 'Platform fallback buttons (keyed by platform id)'
      sequence:
        type: webshare.image_button
    icon_map:
      type: sequence
      label: 'Per-platform icon map (Drupal Core Icons API)'
      sequence:
        type: webshare.icon_reference
    native_share_icon:
      type: webshare.icon_reference
      label: 'Native share button icon (Drupal Core Icons API)'

# Reference to an icon registered with the Drupal Core Icons API (also
# served by the ui_icons contrib module on older sites).
webshare.icon_reference:
  type: mapping
  mapping:
    pack:
      type: string
      label: 'Icon pack id'
    icon:
      type: string
      label: 'Icon id'

webshare.image_button:
  type: mapping
  mapping:
    name:
      type: string
    title:
      type: string
    enabled:
      type: integer
    image:
      type: string
    weight:
      type: integer

# Schema for the Share (share) block plugin settings.
# Required by Drupal Canvas, which validates every component instance's
# configuration against the matching schema.
block.settings.share:
  type: block_settings
  label: 'Share block'
  # Drupal Canvas requires every block component to opt in to strict
  # config validation via the FullyValidatable constraint so it can
  # safely render the block as a Canvas component on content templates.
  # @see https://www.drupal.org/node/3404425
  constraints:
    FullyValidatable: ~
  mapping:
    heading:
      type: label
      label: 'Title'
    display_title:
      type: boolean
      label: 'Display title'
    alignment:
      type: string
      label: 'Alignment'
      constraints:
        Choice:
          - start
          - end
    orientation:
      type: string
      label: 'Orientation'
      constraints:
        Choice:
          - horizontal
          - vertical
    mobile_visibility:
      type: string
      label: 'Mobile visibility'
      constraints:
        Choice:
          - all
          - hide_mobile
          - mobile_only
    native_share:
      type: boolean
      label: 'Show native share button'
    placement:
      type: string
      label: 'Placement'
      constraints:
        Choice:
          - inline
          - rail-end
